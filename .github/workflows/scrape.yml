name: Scrape Freelance Sites

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run bot
      env:
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      run: python bot.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "Freelance Bot"
        git config --global user.email "bot@freelance.com"
        git add seen_projects.json || true
        git commit -m "Update seen projects [skip ci]" || exit 0
        git pull --rebase origin main || true
        git push || true
